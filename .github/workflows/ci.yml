name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: desk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d desk_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/desk_ci
      RUN_DB_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx prisma validate --schema prisma/schema.prisma
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npx prisma migrate deploy --schema prisma/schema.prisma
      - run: npm run seed --workspace apps/web
      - run: npm run typecheck --workspace apps/web
      - run: npm run lint --workspace apps/web
      - run: npm test --workspace apps/web
      - run: npm run build --workspace apps/web
